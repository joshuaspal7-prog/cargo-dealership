<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Car-Go CRM</title>
<style>
:root{
  --bg:#111316;--panel:#191c20;--panel2:#20242a;--line:#2c3138;--ink:#f2f4f7;--mute:#98a2ae;--soft:#c9d0d8;
  --brand:#e0283c;--brand2:#ff4d5e;--ok:#2fbf71;--warn:#f0a020;--info:#4b8df8;
  --hot:#ff4d5e;--warm:#f59e0b;--pot:#4b8df8;--low:#6b7280;
  --r:12px;--sh:0 8px 28px rgba(0,0,0,.35)
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--brand2)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand2)}
textarea{min-height:84px;resize:vertical}
label{display:block;font-size:.78rem;color:var(--mute);margin:0 0 4px;text-transform:uppercase;letter-spacing:.4px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:9px;padding:9px 15px;font-weight:650;cursor:pointer;background:var(--brand);color:#fff;white-space:nowrap}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--soft)}
.btn.sm{padding:6px 11px;font-size:.85rem}
.btn.ok{background:var(--ok)}.btn.danger{background:transparent;border:1px solid #6b2630;color:#ff8b97}
.muted{color:var(--mute)}.small{font-size:.83rem}
.hidden{display:none!important}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:16px}
.auth .card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--sh)}
.auth img{height:54px;border-radius:8px;display:block;margin:0 auto 10px}
.auth h1{text-align:center;font-size:1.25rem;margin:0 0 4px}
.auth p{text-align:center;margin:0 0 18px}
.auth .f{margin-bottom:12px}
.auth .row{display:flex;justify-content:space-between;margin-top:12px}
.linkbtn{background:none;border:0;color:var(--brand2);cursor:pointer;padding:0;font-size:.88rem}
.msg{font-size:.88rem;margin-top:10px;min-height:1.2em}
.msg.err{color:#ff8b97}.msg.ok{color:var(--ok)}

/* layout */
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:#0c0e10;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand img{height:34px;border-radius:6px}.brand b{font-size:1.02rem;line-height:1.1}.brand b span{color:var(--brand2)}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:10px 12px;color:var(--soft);cursor:pointer;font-weight:550}
.nav:hover{background:var(--panel)}.nav.on{background:var(--panel2);color:#fff;box-shadow:inset 3px 0 0 var(--brand)}
.nav .ct{margin-left:auto;background:var(--brand);color:#fff;border-radius:20px;font-size:.72rem;padding:1px 7px}
aside .me{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;font-size:.82rem;color:var(--mute);word-break:break-all}
main{padding:24px 28px 60px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h2{margin:0;font-size:1.45rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.panel h3{margin:0 0 12px;font-size:1rem}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi small{color:var(--mute);font-size:.78rem;text-transform:uppercase;letter-spacing:.4px}
.kpi b{display:block;font-size:1.75rem;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.accent b{color:var(--brand2)}
.two{grid-template-columns:1.4fr 1fr}

/* pipeline flow */
.flow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.stage{flex:1;min-width:104px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;position:relative;cursor:pointer}
.stage small{display:block;color:var(--mute);font-size:.74rem}.stage b{font-size:1.35rem}
.stage.sold b{color:var(--ok)}.stage.lost b{color:var(--low)}
.bar{height:8px;border-radius:8px;background:var(--panel2);overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}

.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.list li{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.act{display:flex;gap:10px;align-items:flex-start}
.act .dot{width:8px;height:8px;border-radius:50%;background:var(--brand2);margin-top:7px;flex:none}
.act.ai .dot{background:var(--info)}.act.public_form .dot{background:var(--ok)}
.rec{display:flex;gap:10px;align-items:center;justify-content:space-between}

/* tables */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{max-width:260px}.toolbar select{width:auto}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;background:var(--panel)}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.4px;color:var(--mute);background:var(--panel2);white-space:nowrap}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--panel2)}
tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.74rem;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.t-hot{background:rgba(255,77,94,.16);color:var(--hot)}.t-warm{background:rgba(245,158,11,.16);color:var(--warm)}
.t-potential{background:rgba(75,141,248,.16);color:var(--pot)}.t-low{background:rgba(107,114,128,.22);color:#aab1bb}
.t-none{background:var(--panel2);color:var(--mute)}
.s-badge{background:var(--panel2);border:1px solid var(--line);color:var(--soft)}
.s-sold{color:var(--ok);border-color:#1f5a3b}.s-lost{color:var(--low)}
.empty{padding:36px 16px;text-align:center;color:var(--mute)}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(8,minmax(190px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:200px}
.col.drop{border-color:var(--brand2)}
.col h4{margin:0 0 8px;font-size:.84rem;display:flex;justify-content:space-between;color:var(--soft)}
.lcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px;cursor:grab}
.lcard b{display:block;font-size:.9rem}.lcard .muted{font-size:.8rem}

/* inventory */
.inv{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.vcard:hover{border-color:var(--soft)}
.vcard .ph{aspect-ratio:16/10;background:var(--panel2) center/cover no-repeat;display:grid;place-items:center;color:var(--mute)}
.vcard .bd{padding:12px 14px}
.vcard h4{margin:0 0 4px}.price{font-weight:800;color:var(--brand2)}
.st-available{background:rgba(47,191,113,.15);color:var(--ok)}.st-pending{background:rgba(240,160,32,.15);color:var(--warn)}
.st-sold{background:rgba(107,114,128,.22);color:#aab1bb}.st-hidden{background:var(--panel2);color:var(--mute)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(720px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;box-shadow:var(--sh)}
.drawer header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer header h3{margin:0;font-size:1.1rem}
.drawer .body{padding:16px 20px 40px;overflow-y:auto;flex:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 20px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 12px;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;font-weight:600;white-space:nowrap}
.tab.on{color:#fff;border-color:var(--brand)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.sec{margin:20px 0 8px;font-size:.8rem;color:var(--brand2);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.scoregrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.msgitem{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel2)}
.msgitem.out{border-left:3px solid var(--brand)}.msgitem.in{border-left:3px solid var(--ok)}
.msgitem header{all:unset;display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--mute);margin-bottom:4px}
.pre{white-space:pre-wrap;word-break:break-word}
.notice{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 12px;font-size:.88rem}
.notice.warn{border-color:#6b4a12;color:#ffd38a}.notice.good{border-color:#1f5a3b;color:#9fe3bd}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs div{position:relative}.thumbs img{width:86px;height:60px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:2px;right:2px;background:#000a;border:0;color:#fff;border-radius:50%;width:20px;height:20px;cursor:pointer;line-height:1}
.aibtns{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.aibtn{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.aibtn h4{margin:0 0 6px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#000;border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:60;max-width:90vw}
.toast.err{border-color:#6b2630;color:#ff8b97}

@media print{aside,.toolbar,#rpPrint,#rpDays,#toastHost{display:none!important}.app{display:block}body,main{background:#fff;color:#000}.panel,.kpi{border-color:#ccc;background:#fff;break-inside:avoid}.muted{color:#555}th{background:#eee;color:#333}.bar{background:#eee}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;padding:8px;z-index:30;gap:2px}
  .brand{padding:0 6px 0 0}.brand b{display:none}
  .nav{width:auto;padding:8px 10px;font-size:.88rem}.nav.on{box-shadow:inset 0 -3px 0 var(--brand)}
  aside .me{display:none}
  main{padding:16px 16px 50px}
  .form{grid-template-columns:1fr}.scoregrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .toolbar input{max-width:none}
}
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<section id="auth" class="auth hidden">
  <div class="card">
    <img src="../logo.jpg" alt="Car-Go logo" onerror="this.remove()">
    <h1>Car-Go CRM</h1>
    <p class="muted small" id="authSub">Staff sign in</p>
    <form id="authForm">
      <div class="f"><label for="aEmail">Email</label><input id="aEmail" type="email" autocomplete="username" required></div>
      <div class="f" id="aPassWrap"><label for="aPass">Password</label><input id="aPass" type="password" autocomplete="current-password" minlength="8"></div>
      <button class="btn" style="width:100%;justify-content:center" id="aSubmit">Sign in</button>
    </form>
    <div class="row">
      <button class="linkbtn" id="aToggle" type="button">First time? Create account</button>
      <button class="linkbtn" id="aForgot" type="button">Forgot password</button>
    </div>
    <div class="msg" id="aMsg"></div>
  </div>
</section>

<section id="noaccess" class="auth hidden">
  <div class="card">
    <h1>No access yet</h1>
    <p class="muted">You're signed in as <b id="naEmail"></b>, but this account hasn't been invited to the Car-Go CRM. Ask the owner to add your email in Settings → Staff, then sign out and back in.</p>
    <button class="btn ghost" style="width:100%;justify-content:center" data-signout>Sign out</button>
  </div>
</section>

<section id="recovery" class="auth hidden">
  <div class="card">
    <h1>Set a new password</h1>
    <form id="recForm"><div class="f"><label for="recPass">New password</label><input id="recPass" type="password" minlength="8" required autocomplete="new-password"></div>
    <button class="btn" style="width:100%;justify-content:center">Save password</button></form>
    <div class="msg" id="recMsg"></div>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app" class="app hidden">
  <aside>
    <div class="brand"><img src="../logo.jpg" alt="" onerror="this.remove()"><b>Car-Go <span>CRM</span></b></div>
    <button class="nav" data-view="dashboard">📊 Dashboard</button>
    <button class="nav" data-view="leads">👥 Leads <span class="ct hidden" id="ctNew"></span></button>
    <button class="nav" data-view="pipeline">🧭 Pipeline</button>
    <button class="nav" data-view="inventory">🚗 Inventory</button>
    <button class="nav" data-view="assistant">✨ AI Assistant</button>
    <button class="nav" data-view="reports">📈 Reports</button>
    <button class="nav" data-view="settings">⚙️ Settings</button>
    <div class="me"><div id="meName"></div><button class="linkbtn" data-signout style="margin-top:6px">Sign out</button></div>
  </aside>
  <main id="view"></main>
</div>

<div id="drawerHost"></div>
<div id="toastHost"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
"use strict";
/* Public, browser-safe values. The anon key only allows what the database security rules permit. */
const SUPABASE_URL = "https://mjbjrqrmfpjmnaijbtso.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qYmpycXJtZnBqbW5haWpidHNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0OTc1OTIsImV4cCI6MjEwOTA3MzU5Mn0.5szlgPPGnvBzaduK54RhIW4-EfGAPrgPJpy1NpnLpXE";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STAGES = [
  ["new","New Lead"],["researching","Researching"],["qualified","Qualified"],["contacted","Contacted"],
  ["responded","Responded"],["appointment","Appointment Booked"],["sold","Sold"],["lost","Lost"]];
const STAGE_LABEL = Object.fromEntries(STAGES);
const SOURCES = [
  ["website_form","Website form"],["instagram","Instagram"],["facebook","Facebook"],["reddit","Reddit"],
  ["kijiji","Kijiji"],["google_web","Google / web"],["referral","Referral"],["walk_in","Walk-in"],["phone","Phone call"],["other","Other"]];
const SOURCE_LABEL = Object.fromEntries(SOURCES);
const URL_REQUIRED = new Set(["instagram","facebook","reddit","kijiji","google_web"]);
const PERMS = [
  ["none","None — do not message privately"],["public_reply_only","Public reply only (in the original thread)"],
  ["implied","Implied (enquiry / business relationship)"],["express","Express consent (opted in)"],["unsubscribed","Unsubscribed / do not contact"]];
const PERM_LABEL = Object.fromEntries(PERMS);
const TIER_LABEL = {hot:"HOT LEAD",warm:"WARM LEAD",potential:"POTENTIAL LEAD",low:"LOW PRIORITY"};
const FACTORS = [["intent","Buying intent",30],["budget","Budget clarity",20],["location","Location",15],["timeline","Timeline",15],["match","Inventory match",20]];
const CHANNELS = [["email","Email"],["sms","SMS"],["instagram","Instagram DM"],["facebook","Facebook message"],["website","Website reply"],["phone","Phone call"],["in_person","In person"],["public_reply","Public reply in thread"]];
const CH_LABEL = Object.fromEntries(CHANNELS);
const CONSENT_TYPES = [["express","Express consent (they opted in)"],["implied_inquiry","Implied — they enquired (6 months)"],["implied_business_relationship","Implied — existing business relationship (2 years)"],["response_to_request","Responding to their direct request"],["withdrawn","Withdrawn / unsubscribed (STOP)"]];
const CONSENT_LABEL = Object.fromEntries(CONSENT_TYPES);

const S = {user:null, me:null, staff:[], leads:[], vehicles:[], settings:null, view:"dashboard", filters:{q:"",status:"",tier:"",source:""}};

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => n == null || n === "" ? "" : "$" + Number(n).toLocaleString("en-CA",{maximumFractionDigits:0});
const km = n => n == null ? "" : Number(n).toLocaleString("en-CA") + " km";
const fmtDate = d => d ? new Date(d).toLocaleDateString("en-CA",{month:"short",day:"numeric",year:"numeric"}) : "";
const fmtDT = d => d ? new Date(d).toLocaleString("en-CA",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "";
const ago = d => { const s=(Date.now()-new Date(d))/1000; if(s<60)return"just now"; if(s<3600)return Math.floor(s/60)+"m ago"; if(s<86400)return Math.floor(s/3600)+"h ago"; return Math.floor(s/86400)+"d ago"; };
const opts = (list, sel, blank) => (blank!=null?`<option value="">${esc(blank)}</option>`:"") + list.map(([v,l])=>`<option value="${esc(v)}"${String(sel??"")===String(v)?" selected":""}>${esc(l)}</option>`).join("");
const leadName = l => l.display_name || l.contact_handle || l.contact_email || (l.source_url ? SOURCE_LABEL[l.source_platform]+" post" : "Unnamed lead");
const staffName = id => { const s=S.staff.find(x=>x.id===id); return s ? (s.full_name||s.email) : ""; };
const vehTitle = v => [v.year,v.make,v.model,v.trim].filter(Boolean).join(" ");
const tierBadge = l => l.tier ? `<span class="badge t-${l.tier}">${TIER_LABEL[l.tier]} · ${l.score}</span>` : `<span class="badge t-none">Not scored</span>`;
const stageBadge = s => `<span class="badge s-badge s-${s}">${esc(STAGE_LABEL[s]||s)}</span>`;
const budgetText = l => l.budget_min||l.budget_max ? [money(l.budget_min),money(l.budget_max)].filter(Boolean).join(" – ") : (l.budget_text||"");
const num = v => v === "" || v == null ? null : Number(v);
const nul = v => (v ?? "").toString().trim() === "" ? null : v.toString().trim();

function toast(t, err){ const h=$("#toastHost"); h.innerHTML=`<div class="toast${err?" err":""}">${esc(t)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>h.innerHTML="",err?6000:2800); }
function friendlyErr(e){
  const m = e?.message || String(e);
  if (/leads_source_url_uniq/.test(m)) return "A lead with this source URL already exists.";
  if (/leads_email_uniq/.test(m)) return "A lead with this email already exists.";
  if (/leads_phone_uniq/.test(m)) return "A lead with this phone number already exists.";
  if (/vehicles_vin_key/.test(m)) return "A vehicle with this VIN already exists.";
  return m.replace(/^.*CASL check failed: /,"CASL safeguard: ");
}
async function q(promise){ const {data,error} = await promise; if (error) throw error; return data; }
async function log(action, entity, entity_id, details){
  try { await sb.from("activity_log").insert({actor_id:S.user.id, actor_kind:"staff", action, entity, entity_id, details}); } catch(e){}
}
function show(id){ ["auth","noaccess","recovery","app"].forEach(x=>$("#"+x).classList.toggle("hidden", x!==id)); }

/* ---------- auth ---------- */
let authMode = "signin";
function setAuthMode(m){
  authMode = m;
  $("#authSub").textContent = m==="signin" ? "Staff sign in" : m==="signup" ? "Create your staff account (invited emails only)" : "Reset your password";
  $("#aSubmit").textContent = m==="signin" ? "Sign in" : m==="signup" ? "Create account" : "Send reset link";
  $("#aPassWrap").classList.toggle("hidden", m==="reset");
  $("#aToggle").textContent = m==="signin" ? "First time? Create account" : "Back to sign in";
  $("#aPass").autocomplete = m==="signup" ? "new-password" : "current-password";
  $("#aMsg").textContent=""; $("#aMsg").className="msg";
}
$("#aToggle").onclick = () => setAuthMode(authMode==="signin" ? "signup" : "signin");
$("#aForgot").onclick = () => setAuthMode("reset");
$("#authForm").onsubmit = async e => {
  e.preventDefault();
  const email = $("#aEmail").value.trim(), pass = $("#aPass").value, msg = $("#aMsg"), btn = $("#aSubmit");
  msg.className="msg"; msg.textContent=""; btn.disabled=true;
  try {
    const redirectTo = location.origin + location.pathname;
    if (authMode==="signin"){
      if (pass.length<8) throw new Error("Password must be at least 8 characters.");
      await q(sb.auth.signInWithPassword({email, password:pass}));
    } else if (authMode==="signup"){
      if (pass.length<8) throw new Error("Password must be at least 8 characters.");
      const d = await q(sb.auth.signUp({email, password:pass, options:{emailRedirectTo:redirectTo}}));

function recommendations(){
  const out = [], today = new Date().toISOString().slice(0,10);
  const open = S.leads.filter(l=>!["sold","lost"].includes(l.status));
  const due = open.filter(l=>l.next_follow_up && l.next_follow_up<=today).sort((a,b)=>a.next_follow_up.localeCompare(b.next_follow_up));
  due.slice(0,3).forEach(l=>out.push({html:`<b>Follow up with ${esc(leadName(l))}</b><div class="muted small">${l.next_follow_up<today?"Overdue since":"Due"} ${fmtDate(l.next_follow_up+"T12:00")}</div>`, btn:`<button class="btn sm ghost" data-openlead="${l.id}">Open</button>`}));
  const unanswered = open.filter(l=>l.source_platform==="website_form" && ["new","researching"].includes(l.status));
  unanswered.slice(0,3).forEach(l=>out.push({html:`<b>Reply to website enquiry from ${esc(leadName(l))}</b><div class="muted small">Received ${ago(l.created_at)}${l.looking_for?" · "+esc(l.looking_for):""}</div>`, btn:`<button class="btn sm" data-openlead="${l.id}">Reply</button>`}));
  const hotWaiting = open.filter(l=>l.score>=60 && ["new","researching","qualified"].includes(l.status) && l.source_platform!=="website_form").sort((a,b)=>b.score-a.score);
  hotWaiting.slice(0,3).forEach(l=>out.push({html:`<b>${l.tier==="hot"?"Hot":"Warm"} lead not contacted: ${esc(leadName(l))}</b><div class="muted small">Score ${l.score} · ${esc(PERM_LABEL[l.contact_permission])}</div>`, btn:`<button class="btn sm ghost" data-openlead="${l.id}">Open</button>`}));
  const unscored = open.filter(l=>l.score==null).length;
  if (unscored) out.push({html:`<b>${unscored} lead${unscored>1?"s":""} not scored yet</b><div class="muted small">Score them so you know who to call first.</div>`, btn:`<button class="btn sm ghost" data-go="leads">View</button>`});
  S.vehicles.filter(v=>v.status==="available" && v.price==null).forEach(v=>out.push({html:`<b>Add a price to the ${esc(vehTitle(v))}</b><div class="muted small">Budget matching needs a price.</div>`, btn:`<button class="btn sm ghost" data-openveh="${v.id}">Edit</button>`}));

  if (!out.length) out.push({html:`<span class="muted">You're all caught up. 🎉</span>`});
  return out.slice(0,8);
}

function exportCsv(){
  const rows = filteredLeads();
  if (!rows.length) return toast("No leads to export.", true);
  const cols = [["display_name","Name"],["contact_email","Email"],["contact_phone","Phone"],["contact_handle","Handle"],["source_platform","Source"],["source_url","Source URL"],["discovered_at","Discovered"],["location","Location"],["looking_for","Looking for"],["vehicle_preferences","Vehicle preferences"],["budget_min","Budget min"],["budget_max","Budget max"],["budget_text","Budget notes"],["timeline","Timeline"],["contact_permission","Contact permission"],["score","Score"],["tier","Tier"],["status","Status"],["assigned_to","Assigned to"],["next_follow_up","Next follow-up"],["why_lead","Why a lead"],["suggested_next_action","Next action"]];
  const cell = v => { let s = v==null ? "" : String(v); if (/^[=+\-@\t\r]/.test(s)) s = "'"+s; return /[",\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const csv = [cols.map(c=>c[1]).join(",")].concat(rows.map(l=>cols.map(([k])=>cell(k==="assigned_to"?staffName(l[k]):l[k])).join(","))).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"}));
  a.download = `cargo-leads-${new Date().toISOString().slice(0,10)}.csv`; a.click();
  log("leads_exported","lead",null,{count:rows.length});
}

  const close = () => { host.innerHTML=""; document.removeEventListener("keydown",esck); onClose&&onClose(); };

}

        Object.assign(l, saved); markDirty(); toast("Saved."); leadDetails(d,l,markDirty);

async function leadConvo(d, l, markDirty){
  d.body.innerHTML = `<div class="muted">Loading…</div>`;
  const msgs = await q(sb.from("messages").select("*").eq("lead_id",l.id).order("created_at",{ascending:true}));
  const S_ = {logged:"Logged",draft:"Draft — needs approval",approved:"Approved — send it yourself, then mark sent",rejected:"Rejected",sent:"Sent"};
  d.body.innerHTML = `
    <div class="notice" style="margin-bottom:14px">Nothing is ever sent automatically. Drafts need a staff member's approval, and approval is blocked unless this lead has a recorded consent or legal basis for that channel (CASL). After approving, send it yourself from Instagram, Gmail, etc., then click “Mark sent”.</div>
    ${msgs.length?msgs.map(m=>`<div class="msgitem ${m.direction==="inbound"?"in":"out"}">
      <header><span>${m.direction==="inbound"?"⬅ From lead":"➡ To lead"} · ${esc(CH_LABEL[m.channel]||m.channel)}${m.ai_generated?" · auto-drafted":""}</span><span>${fmtDT(m.created_at)}</span></header>
      ${m.subject?`<b>${esc(m.subject)}</b>`:""}<div class="pre">${esc(m.body)}</div>
      ${m.direction==="outbound"?`<div class="small muted" style="margin-top:6px">${esc(S_[m.state]||m.state)}${m.approved_by?` · approved by ${esc(staffName(m.approved_by))}`:""}${m.sent_at?` · sent ${fmtDT(m.sent_at)}`:""}</div>
        <div class="actions" style="margin-top:6px">${m.state==="draft"?`<button class="btn sm ok" data-approve="${m.id}">Approve</button><button class="btn sm ghost" data-reject="${m.id}">Reject</button>`:""}${m.state==="approved"?`<button class="btn sm" data-sent="${m.id}">Mark sent</button><button class="btn sm ghost" data-copy="${m.id}">Copy text</button>`:""}</div>`:""}
    </div>`).join(""):`<div class="empty">No messages yet.</div>`}
    <div class="sec">Add to conversation</div>
    <form id="mf" class="form">
      <div><label>Direction</label><select name="direction"><option value="inbound">They wrote to us (log it)</option><option value="outbound">Draft a message to them</option></select></div>
      <div><label>Channel</label><select name="channel">${opts(CHANNELS,"email")}</select></div>
      <div class="full"><label>Subject (email only)</label><input name="subject"></div>
      <div class="full"><label>Message</label><textarea name="body" required></textarea></div>
      <div class="full" id="chk"></div>
    </form>
    <div class="actions"><button class="btn ghost" id="mGen">✨ Write a draft for me</button><button class="btn" id="mAdd">Save</button></div>`;
  const f=$("#mf"); let generated=false;
  $("#mGen").onclick = async () => {
    f.direction.value="outbound"; if (["phone","in_person"].includes(f.channel.value)) f.channel.value=defaultChannel(l);
    const g = await draftFor(l, f.channel.value); f.subject.value=g.subject||""; f.body.value=g.body; generated=true; check();
    toast("Draft written — edit it, then Save. It still needs approval before sending.");
  };
  f.body.addEventListener("input",()=>{});
  const check = async () => {
    if (f.direction.value!=="outbound") return $("#chk").innerHTML="";
    const r = await sb.rpc("contact_check",{p_lead:l.id,p_channel:f.channel.value});
    const ok = r.data?.[0]?.allowed, why = r.data?.[0]?.reason || r.error?.message;
    $("#chk").innerHTML = `<div class="notice ${ok?"good":"warn"}">${ok?"✓ Can be approved for this channel: ":"⚠ Can be drafted, but not approved: "}${esc(why)}</div>`;
  };
  f.direction.onchange = check; f.channel.onchange = check;
  $("#mAdd").onclick = async () => {
    const body=f.body.value.trim(); if(!body) return toast("Write the message first.",true);
    const out = f.direction.value==="outbound";
    try {
      await q(sb.from("messages").insert({lead_id:l.id, direction:f.direction.value, channel:f.channel.value, subject:nul(f.subject.value), body, state: out?"draft":"logged", ai_generated: out&&generated, created_by:S.user.id}));
      await log("message_logged","lead",l.id,{name:leadName(l),direction:f.direction.value});
      markDirty(); leadConvo(d,l,markDirty);
    } catch(e){ toast(friendlyErr(e),true); }
  };
  const upd = async (id, state, action) => {
    try { await q(sb.from("messages").update({state}).eq("id",id)); if(action) await log(action,"lead",l.id,{name:leadName(l)});
      if (state==="sent" && ["new","researching","qualified"].includes(l.status)) { await q(sb.from("leads").update({status:"contacted"}).eq("id",l.id)); l.status="contacted"; await log("status_changed","lead",l.id,{name:leadName(l),to:"contacted"}); }
      markDirty(); leadConvo(d,l,markDirty); }
    catch(e){ toast(friendlyErr(e),true); }
  };
  $$("[data-approve]",d.body).forEach(b=>b.onclick=()=>upd(b.dataset.approve,"approved","message_approved"));
  $$("[data-reject]",d.body).forEach(b=>b.onclick=()=>upd(b.dataset.reject,"rejected"));
  $$("[data-sent]",d.body).forEach(b=>b.onclick=()=>upd(b.dataset.sent,"sent","message_sent"));
  $$("[data-copy]",d.body).forEach(b=>b.onclick=async()=>{ const m=msgs.find(x=>x.id===b.dataset.copy); try{ await navigator.clipboard.writeText(m.body); toast("Copied."); }catch{ toast("Couldn't copy — select the text instead.",true);} });
}

async function leadConsent(d, l, markDirty){
  d.body.innerHTML = `<div class="muted">Loading…</div>`;
  const recs = await q(sb.from("consent_records").select("*").eq("lead_id",l.id).order("obtained_at",{ascending:false}));
  const st = S.settings;
  d.body.innerHTML = `
    <div class="notice" style="margin-bottom:14px">Under CASL, a public post or a visible email/handle is <b>not</b> consent. Record how you got permission (or the legal basis) before sending private messages. Every commercial message must identify ${esc(st?.business_name||"the business")} and offer a way to unsubscribe.</div>
    ${recs.length?recs.map(r=>{ const exp = r.expires_at && new Date(r.expires_at)<new Date(); return `<div class="msgitem ${r.consent_type==="withdrawn"?"out":"in"}"><header><span><b>${esc(CONSENT_LABEL[r.consent_type])}</b> · ${esc(r.channel||"any channel")}</span><span>${fmtDate(r.obtained_at)}</span></header><div class="pre">${esc(r.basis)}</div>${r.evidence?`<div class="small muted">Evidence: ${esc(r.evidence)}</div>`:""}${r.expires_at?`<div class="small ${exp?"":"muted"}" style="${exp?"color:#ff8b97":""}">${exp?"Expired":"Expires"} ${fmtDate(r.expires_at)}</div>`:""}${r.recorded_by?`<div class="small muted">Recorded by ${esc(staffName(r.recorded_by))}</div>`:""}</div>`; }).join(""):`<div class="empty">No consent recorded. Private messages to this lead can't be approved yet.</div>`}
    <div class="sec">Record consent or legal basis</div>
    <form id="cf" class="form">
      <div><label>Type</label><select name="consent_type">${opts(CONSENT_TYPES,"express")}</select></div>
      <div><label>Channel</label><select name="channel">${opts([["any","Any channel"],["email","Email"],["sms","SMS"],["instagram","Instagram"],["facebook","Facebook"]],"any")}</select></div>
      <div class="full"><label>How it was obtained (plain language)</label><textarea name="basis" required placeholder="e.g. Customer asked us by Instagram DM on Nov 2 to send them SUVs under $15k."></textarea></div>
      <div class="full"><label>Evidence (link, screenshot name, message reference)</label><input name="evidence"></div>
    </form>
    <div class="actions"><button class="btn" id="cAdd">Record</button><button class="btn danger" id="cStop">They said STOP / unsubscribe</button></div>`;
  const f=$("#cf");
  const add = async (type, basis, channel, evidence) => {
    const exp = type==="implied_inquiry" ? 183 : type==="implied_business_relationship" ? 730 : null;
    try {
      await q(sb.from("consent_records").insert({lead_id:l.id, consent_type:type, channel, basis, evidence:nul(evidence), recorded_by:S.user.id, expires_at: exp? new Date(Date.now()+exp*864e5).toISOString():null}));
      const perm = type==="withdrawn" ? "unsubscribed" : type==="express" ? "express" : (["none","public_reply_only"].includes(l.contact_permission)?"implied":l.contact_permission);
      if (type!=="withdrawn" && perm!==l.contact_permission && l.contact_permission!=="unsubscribed"){ await q(sb.from("leads").update({contact_permission:perm}).eq("id",l.id)); }
      l.contact_permission = l.contact_permission==="unsubscribed" && type!=="withdrawn" ? "unsubscribed" : perm;
      await log("consent_recorded","lead",l.id,{name:leadName(l),type});
      markDirty(); toast(type==="withdrawn"?"Unsubscribed — added to do-not-contact list.":"Recorded."); leadConsent(d,l,markDirty);
    } catch(e){ toast(friendlyErr(e),true); }
  };
  $("#cAdd").onclick = () => { const b=f.basis.value.trim(); if(!b) return toast("Describe how consent was obtained.",true); add(f.consent_type.value,b,f.channel.value,f.evidence.value); };
  $("#cStop").onclick = () => { if(confirm("Mark this person as unsubscribed? They'll be added to the do-not-contact list.")) add("withdrawn","Person asked to stop receiving messages.","any",f.evidence.value); };
}

/* ---------- FREE rule-based scoring & matching (no API key, runs in the browser) ---------- */
const TOWNS = [[/\b(hamilton|stoney creek|stoney|east hamilton|mountain|centennial|winona)\b/i,15,"in Hamilton / Stoney Creek"],
  [/\b(burlington|ancaster|grimsby|dundas|waterdown|binbrook|flamborough|beamsville|glanbrook|caledonia|mount hope)\b/i,13,"close to Hamilton"],
  [/\b(brantford|oakville|st\.? ?catharines|niagara|welland|lincoln|milton|cambridge|paris)\b/i,9,"within driving distance"],
  [/\b(toronto|mississauga|brampton|kitchener|waterloo|guelph|london|ontario|gta)\b/i,4,"elsewhere in Ontario"]];
const BODY = {suv:/\b(suv|crossover|cr-?v|rav ?4|pilot|rogue|escape|equinox|tucson|santa fe|cx-?5|highlander|3rd row|third row|7 ?seat)/i,
  sedan:/\b(sedan|civic|corolla|camry|accord|elantra|mazda ?3|sentra)\b/i, truck:/\b(truck|pickup|f-?150|silverado|ram|tacoma|sierra)\b/i,
  minivan:/\b(minivan|van|caravan|odyssey|sienna|pacifica)\b/i, hatchback:/\b(hatch|hatchback|fit|golf|yaris)\b/i};
function parseMoney(t){ if(!t) return null; const m=[...String(t).matchAll(/\$?\s?(\d{1,3}(?:[,\s]\d{3})+|\d+(?:\.\d+)?)\s*(k|grand|thousand)?/gi)].map(x=>{let n=parseFloat(x[1].replace(/[,\s]/g,"")); if(x[2]||n<200) n*=1000; return n;}).filter(n=>n>=1000&&n<=200000); return m.length?Math.max(...m):null; }
function leadText(l){ return [l.looking_for,l.vehicle_preferences,l.source_excerpt,l.budget_text,l.timeline,l.location].filter(Boolean).join(" \n"); }
function ruleMatch(l, inv){
  const t = leadText(l).toLowerCase(), budget = l.budget_max || parseMoney(l.budget_text) || (l.source_platform!=="website_form"?parseMoney(l.source_excerpt):null);
  const wantBody = Object.entries(BODY).filter(([,re])=>re.test(t)).map(([k])=>k);
  const wantAwd = /\b(awd|4wd|4x4|all.?wheel|winter|snow)\b/i.test(t), wantSeats = /\b(3rd row|third row|7 ?seat|8 ?seat|family of [5-9])\b/i.test(t);
  const lowKm = /\b(low (km|kms|mileage)|under \d{2,3},?\d{0,3} ?k?m)\b/i.test(t);
  return inv.filter(v=>["available","pending"].includes(v.status)).map(v=>{
    let fit=30; const why=[], cons=[];
    const vb=(v.body_type||"").toLowerCase(), name=`${v.make} ${v.model}`.toLowerCase();
    if (t.includes(v.make.toLowerCase())||t.includes(v.model.toLowerCase())){ fit+=25; why.push(`they mentioned ${v.make}${t.includes(v.model.toLowerCase())?" "+v.model:""}`); }
    if (wantBody.length){ if (wantBody.some(b=>vb.includes(b)||BODY[b].test(name))){ fit+=25; why.push(`it's the ${v.body_type||"type"} they want`);} else { fit-=20; cons.push(`they want a ${wantBody.join("/")}`);} }
    if (wantAwd){ if (/awd|4wd/i.test(v.drivetrain||"")){ fit+=10; why.push("AWD for winter"); } else cons.push("not AWD"); }
    if (wantSeats){ if (/3rd|third/i.test((v.features||[]).join(" "))||/pilot|highlander|odyssey|sienna/i.test(name)){ fit+=10; why.push("3rd-row seating"); } else cons.push("no 3rd row"); }
    if (budget){ if (v.price==null){ cons.push(`no price set (their budget ~${money(budget)})`); }
      else if (v.price<=budget){ fit+=15; why.push(`${money(v.price)} is within their ~${money(budget)} budget`); }
      else if (v.price<=budget*1.1){ fit+=3; cons.push(`${money(v.price)} is slightly over their ~${money(budget)}`); }
      else { fit-=30; cons.push(`${money(v.price)} is over their ~${money(budget)} budget`); } }
    else cons.push("budget unknown");
    if (lowKm && v.km>150000){ fit-=10; cons.push(`${km(v.km)} — they want low mileage`); }
    return {vehicle_id:v.id, fit:Math.max(0,Math.min(100,fit)), reasons:why.join("; ")||"general used-vehicle interest", concerns:cons.join("; ")||null};
  }).filter(m=>m.fit>=40).sort((a,b)=>b.fit-a.fit).slice(0,3);
}
function ruleScore(l, inv){
  const t = leadText(l), lines=[], b={};
  const direct = ["website_form","walk_in","phone","referral"].includes(l.source_platform);
  let intent = direct ? 26 : 8;
  if (/\b(looking for|looking to buy|need a|want to buy|buying|shopping for|recommend|suggestions?|first car|in the market|test drive|still available|is it available)\b/i.test(t)) intent += direct?4:14;
  if (l.looking_for||l.vehicle_preferences) intent += direct?0:4;
  b.intent=Math.min(30,intent); lines.push(`Intent ${b.intent}/30: ${direct?"contacted Car-Go directly":"public post"}${b.intent>=20?", clearly shopping":b.intent>=12?", some buying signals":", buying intent unclear"}.`);
  const bud = l.budget_max||l.budget_min ? (l.budget_min&&l.budget_max?20:16) : (parseMoney(l.budget_text||(direct?"":l.source_excerpt))?12:(l.budget_text?5:0));
  b.budget=bud; lines.push(`Budget ${bud}/20: ${bud>=16?"stated":bud>=12?"a number was mentioned":bud?"vague":"not stated"}.`);
  const T = TOWNS.find(([re])=>re.test(l.location||"")) || (!l.location && TOWNS.find(([re])=>re.test(t)));
  b.location = T?T[1]:0; lines.push(`Location ${b.location}/15: ${T?T[2]:"unknown"}.`);
  const tl = (l.timeline||"")+" "+(direct?"":(l.source_excerpt||""));
  b.timeline = /\b(asap|today|tomorrow|this week|right away|immediately|urgent|this weekend)\b/i.test(tl)?15 : /\b(this month|next week|couple (of )?weeks|soon|end of (the )?month)\b/i.test(tl)?12 : /\b(before winter|next month|few months|by (spring|summer|fall|december|january)|winter)\b/i.test(tl)?7 : (l.timeline?5:0);
  lines.push(`Timeline ${b.timeline}/15: ${b.timeline>=12?"buying soon":b.timeline>=5?"within a few months":"not stated"}.`);
  const matches = ruleMatch(l, inv);
  b.match = matches.length ? Math.round(matches[0].fit/5) : 0;
  lines.push(`Inventory match ${b.match}/20: ${matches.length?`best fit ${vehTitle(inv.find(v=>v.id===matches[0].vehicle_id))} (${matches[0].fit}/100)`:"nothing in stock fits yet"}.`);
  const score = Object.values(b).reduce((a,c)=>a+c,0);
  return {score, breakdown:b, explanation:"Free rule-based score —\n"+lines.join("\n"), matches};
}
async function freeQualify(leads){
  const inv = S.vehicles; let n=0;
  for (const l of leads){
    const r = ruleScore(l, inv);
    const upd = {score:r.score, score_breakdown:r.breakdown, score_explanation:r.explanation, ai_scored_at:new Date().toISOString()};
    if (!l.suggested_next_action) upd.suggested_next_action = l.source_platform==="website_form" ? "Reply to their enquiry today." : r.matches.length ? `Reply publicly in the thread mentioning the ${vehTitle(inv.find(v=>v.id===r.matches[0].vehicle_id))} and invite them to message Car-Go.` : "Reply publicly with helpful advice and invite them to check Car-Go's inventory.";
    if (["new","researching"].includes(l.status)) upd.status = r.score>=60?"qualified":"researching";
    await q(sb.from("leads").update(upd).eq("id",l.id));
    await q(sb.from("lead_matches").delete().eq("lead_id",l.id));
    if (r.matches.length) await q(sb.from("lead_matches").insert(r.matches.map(m=>({...m, lead_id:l.id}))));
    await log("lead_scored","lead",l.id,{name:leadName(l), score:r.score, matches:r.matches.length});
    n++;
  }
  return n;
}
function freeExtract(text, loc){
  const budget = parseMoney(text);
  const bodies = Object.entries(BODY).filter(([,re])=>re.test(text)).map(([k])=>k.toUpperCase()==="SUV"?"SUV":k);
  const T = TOWNS.find(([re])=>re.test(loc||text));
  const tm = text.match(/\b(asap|today|tomorrow|this week(end)?|next week|this month|next month|before winter|in the spring|in a few months|soon)\b/i);
  return { budget_max: budget, budget_text: (text.match(/(under|below|max|around|about|budget (of|is)?)\s*\$?\s?\d[\d,.]*\s*(k|grand)?|\$\s?\d[\d,.]*\s*(k)?/i)||[])[0]||null,
    location: loc || (T ? (text.match(T[0])||[])[0] : null), looking_for: bodies.length ? bodies.join(" / ") : null,
    vehicle_preferences: [/(awd|4wd|4x4|all.?wheel)/i.test(text)?"AWD/4WD":null, /(low (km|mileage))/i.test(text)?"Low mileage":null, /(3rd row|third row|7 ?seat)/i.test(text)?"3rd row":null, /(first car)/i.test(text)?"First car":null].filter(Boolean).join(", ")||null,
    timeline: tm ? tm[0] : null };
}

    try { const r = await ai("research_post",{platform:$("#rPlat").value, url:$("#rUrl").value.trim(), text:$("#rText").value, username:$("#rUser").value});
      if (r.duplicate){ await done(m, r.message, false); openLead(r.lead_id); return; }
      await done(m, `Saved and scored ${r.score}/100.${r.is_buyer?"":" Note: the AI thinks this person may not be a buyer."}`); $("#rUrl").value=""; $("#rText").value=""; $("#rUser").value=""; openLead(r.lead_id); }
    catch(e){ await done(m, e.message, false); } };
  $("#qGo").onclick = async () => { const m=$("#qMsg"); busy(null,m,true,"Scoring leads…");
    if (!AI_READY){ try { const ls=S.leads.filter(l=>l.score==null&&!["sold","lost"].includes(l.status)); const n=await freeQualify(ls); await done(m, n?`Scored ${n} lead(s) with free rules.`:"No unscored open leads."); } catch(e){ await done(m, friendlyErr(e), false); } return; }
    try { const r = await ai("qualify"); const fails = (r.results||[]).filter(x=>x.error).length; await done(m, r.processed ? `Scored ${r.processed-fails} lead(s).${fails?` ${fails} failed: ${r.results.find(x=>x.error).error}`:""}` : r.message, !fails); }
    catch(e){ await done(m, e.message, false); } };
  $("#mGo").onclick = async () => { const m=$("#mMsg"); busy(null,m,true,"Matching leads to your cars…");
    if (!AI_READY){ try { let n=0; const ls=S.leads.filter(l=>!["sold","lost"].includes(l.status));
        for (const l of ls){ const ms=ruleMatch(l,S.vehicles); await q(sb.from("lead_matches").delete().eq("lead_id",l.id)); if(ms.length){ await q(sb.from("lead_matches").insert(ms.map(x=>({...x,lead_id:l.id})))); n+=ms.length; } }
        await done(m, ls.length?`Checked ${ls.length} lead(s) against ${S.vehicles.filter(v=>v.status==="available").length} available car(s): ${n} match(es).`:"No open leads to match."); } catch(e){ await done(m, friendlyErr(e), false); } return; }
    try { const r = await ai("match"); const n=(r.results||[]).reduce((a,x)=>a+(x.matches||0),0); await done(m, r.processed ? `Checked ${r.processed} lead(s) against ${r.inventory_count} car(s): ${n} match(es) found.` : r.message); }
    catch(e){ await done(m, e.message, false); } };

  $("#oGo").onclick = async () => { const m=$("#oMsg"); busy(null,m,true,"Writing drafts…");
    try { const t = await bulkOutreach(); await done(m, t.length ? `${t.length} draft(s) written. Open each lead → Conversation to review, edit and approve.` : "Every open lead already has a message drafted or sent."); }
    catch(e){ await done(m, friendlyErr(e), false); } };
  $("#wGo").onclick = () => go("reports");
  const drawShortcuts = () => {
    const area = $("#fArea").value || "Hamilton", focus = $("#fFocus").value.trim(), fq = focus ? " "+focus : "";
    const enc = encodeURIComponent, links = [
      ["Reddit r/Hamilton", `https://www.reddit.com/r/Hamilton/search/?q=${enc((focus||"car")+" buy OR looking OR recommend")}&restrict_sr=1&sort=new&t=month`],
      ["Reddit r/Burlington", `https://www.reddit.com/r/Burlington/search/?q=${enc((focus||"car")+" buy OR looking OR dealership")}&restrict_sr=1&sort=new&t=month`],
      ["Reddit — Ontario car advice", `https://www.reddit.com/search/?q=${enc(`"${area}" used car${fq} looking`)}&sort=new&t=month`],
      ["Facebook posts", `https://www.facebook.com/search/posts/?q=${enc(`looking for a used car ${area}${fq}`)}`],
      ["Facebook groups", `https://www.facebook.com/search/groups/?q=${enc(`${area} buy sell cars`)}`],
      ["Kijiji wanted ads", `https://www.google.com/search?q=${enc(`site:kijiji.ca "wanted" car ${area}${fq}`)}&tbs=qdr:m`],
      ["Google (past month)", `https://www.google.com/search?q=${enc(`"looking for" used car ${area}${fq} recommendations`)}&tbs=qdr:m`]];
    $("#shortcuts").innerHTML = links.map(([t,u])=>`<a class="btn sm ghost" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(t)} ↗</a>`).join("");
  };
  drawShortcuts(); $("#fArea").onchange = drawShortcuts; $("#fFocus").oninput = drawShortcuts;
  const drawReqs = async () => { try {
      const rs = await q(sb.from("search_requests").select("*").order("created_at",{ascending:false}).limit(5));
      $("#reqs").innerHTML = rs.length ? `<b>Recent requests</b>` + rs.map(r=>`<div style="margin-top:4px">${{pending:"⏳ Waiting",running:"🔄 Searching",done:"✅ Done",failed:"⚠️ Failed"}[r.status||"pending"]} · ${esc([r.area,r.focus].filter(Boolean).join(" · ")||"General search")} · <span class="muted">${esc(staffName(r.requested_by)||"")} ${ago(r.created_at)}</span>${r.result_summary?`<div class="muted">${esc(r.result_summary)}</div>`:""}</div>`).join("") : "";
    } catch(e){} };
  drawReqs();
  $("#fQueue").onclick = async () => { const m=$("#fMsg"), btn=$("#fQueue"); if (btn.disabled) return; btn.disabled=true; setTimeout(()=>btn.disabled=false,4000);
    try { const pend = await q(sb.from("search_requests").select("id").in("status",["pending","running"]));
      if (pend.length >= 3) { m.className="msg err"; m.textContent="There are already searches waiting — they'll be picked up soon."; return; }
      await q(sb.from("search_requests").insert({requested_by:S.user.id, area:$("#fArea").value||null, focus:nul($("#fFocus").value)}));
      await log("search_requested","search",null,{area:$("#fArea").value||"all", focus:$("#fFocus").value});
      m.className="msg ok"; m.textContent="Request sent. Claude will search and new leads will show up in Leads (usually within a couple of hours during the day)."; drawReqs();

  drawRuns();
  const freeMode = () => { AI_READY=false; $("#aiStatus").className="badge st-available"; $("#aiStatus").textContent="Free mode";
    $("#aiKeyNote").innerHTML = `<div class="notice good" style="margin-bottom:14px"><b>Free mode is on.</b> Scoring, inventory matching and Research a Lead run on built-in rules — no API key, no cost. To find new leads, use <b>Ask Claude to search</b> — it's free and anyone on your team can use it. (Adding a Claude API key later upgrades these buttons to full AI automatically.)</div>`;
    $("#fGo").classList.add("hidden"); $("#oGo").disabled=false; };

  } catch(e){ el.textContent = friendlyErr(e); }

/* ---------- Phase 6: weekly report (from real CRM data) ---------- */
let REPORT_DAYS = 7;
async function renderReports(){
  const V=$("#view");
  V.innerHTML = `<div class="top"><h2>Sales report</h2><div class="muted">Loading…</div></div>`;
  const now=new Date(), start=new Date(now-REPORT_DAYS*864e5), prevStart=new Date(now-2*REPORT_DAYS*864e5);
  let acts=[], runs=[], msgs=[];
  try { [acts, runs, msgs] = await Promise.all([
      q(sb.from("activity_log").select("action,actor_kind,details,created_at").gte("created_at",prevStart.toISOString()).order("created_at",{ascending:false}).limit(1000)),
      q(sb.from("research_runs").select("*").gte("started_at",start.toISOString())),
      q(sb.from("messages").select("lead_id,direction,channel,state,created_at,sent_at").gte("created_at",start.toISOString()))]);
  } catch(e){ V.innerHTML=`<div class="panel">Couldn't load report: ${esc(friendlyErr(e))}</div>`; return; }
  const L=S.leads, inP=(d,a,b)=>{const t=new Date(d); return t>=a && t<b;};
  const cur=L.filter(l=>inP(l.created_at,start,now)), prev=L.filter(l=>inP(l.created_at,prevStart,start));
  const open=L.filter(l=>!["sold","lost"].includes(l.status));
  const qualifiedSet=["qualified","contacted","responded","appointment","sold"];
  const enq = acts.filter(a=>a.action==="enquiry_received" && inP(a.created_at,start,now)).length;
  const sentN = msgs.filter(m=>m.direction==="outbound" && m.state==="sent").length;
  const draftN = msgs.filter(m=>m.direction==="outbound" && m.state==="draft").length;
  const soldNow = acts.filter(a=>a.action==="status_changed" && a.details?.to==="sold" && inP(a.created_at,start,now)).length;
  const apptNow = L.filter(l=>l.appointment_at && inP(l.appointment_at,start,new Date(now.getTime()+7*864e5))).length;
  const delta = (a,b)=> b===0 ? (a? "new" : "–") : `${a>=b?"+":""}${Math.round((a-b)/b*100)}%`;

  // sources
  const srcRows = SOURCES.map(([k,lab])=>{ const all=L.filter(l=>l.source_platform===k); if(!all.length) return null;
    const c=cur.filter(l=>l.source_platform===k).length, ql=all.filter(l=>qualifiedSet.includes(l.status)).length, sold=all.filter(l=>l.status==="sold").length;
    const avg = all.filter(l=>l.score!=null); return {lab,c,all:all.length,ql,sold,avg: avg.length?Math.round(avg.reduce((a,l)=>a+l.score,0)/avg.length):null}; }).filter(Boolean).sort((a,b)=>b.ql-a.ql||b.all-a.all);

  // demand (open + this period)
  const pool = [...new Map([...open,...cur].map(l=>[l.id,l])).values()];
  const types={}; pool.forEach(l=>{ const t=leadText(l); Object.entries(BODY).forEach(([k,re])=>{ if(re.test(t)) types[k]=(types[k]||0)+1; }); if(/\b(awd|4wd|4x4|all.?wheel)\b/i.test(t)) types["AWD/4WD"]=(types["AWD/4WD"]||0)+1; if(/first car/i.test(t)) types["first car"]=(types["first car"]||0)+1; });
  const typeRows = Object.entries(types).sort((a,b)=>b[1]-a[1]);
  const buckets=[["Under $10k",0,10000],["$10k–15k",10000,15000],["$15k–20k",15000,20000],["$20k–30k",20000,30000],["$30k+",30000,1e9]];
  const bud = {}; let unknownBud=0; pool.forEach(l=>{ const b=l.budget_max||l.budget_min||parseMoney(l.budget_text); if(!b){unknownBud++;return;} const k=buckets.find(([,a,z])=>b>=a&&b<z); bud[k[0]]=(bud[k[0]]||0)+1; });
  const locs={}; pool.forEach(l=>{ if(l.location){ const k=l.location.trim().replace(/\b\w/g,c=>c.toUpperCase()); locs[k]=(locs[k]||0)+1; } });

  // inventory fit
  let matches=[]; try { matches = await q(sb.from("lead_matches").select("lead_id,vehicle_id,fit")); } catch {}
  const openIds=new Set(open.map(l=>l.id));
  const vehDemand = S.vehicles.filter(v=>["available","pending"].includes(v.status)).map(v=>({v, n:matches.filter(m=>m.vehicle_id===v.id && openIds.has(m.lead_id)).length})).sort((a,b)=>b.n-a.n);
  const unmatched = open.filter(l=>!matches.some(m=>m.lead_id===l.id) && l.ai_scored_at).length;
  const noPrice = S.vehicles.filter(v=>v.status==="available" && v.price==null);
  const overdue = open.filter(l=>l.next_follow_up && l.next_follow_up < now.toISOString().slice(0,10)).length;
  const unanswered = open.filter(l=>l.source_platform==="website_form" && ["new","researching","qualified"].includes(l.status)).length;
  const hotOpen = open.filter(l=>l.score>=80).length;

  // recommendations (rules applied to the numbers above)
  const recs=[];
  if (unanswered) recs.push(`Reply to the ${unanswered} website enquir${unanswered>1?"ies":"y"} still waiting — direct enquiries are your highest-converting leads.`);
  if (overdue) recs.push(`${overdue} follow-up${overdue>1?"s are":" is"} overdue. Clear these before chasing new leads.`);
  if (hotOpen) recs.push(`${hotOpen} hot lead${hotOpen>1?"s":""} (80+) still open — prioritise calls/replies to these today.`);
  if (draftN) recs.push(`${draftN} outreach draft${draftN>1?"s are":" is"} waiting for approval.`);
  if (noPrice.length) recs.push(`Add a price to: ${noPrice.map(vehTitle).join(", ")}. Leads can't be matched on budget without it, and "Call for price" listings get fewer enquiries.`);
  if (srcRows[0] && srcRows[0].ql) recs.push(`${srcRows[0].lab} is producing your most qualified leads — spend more time there.`);
  if (pool.length && unknownBud/pool.length>0.5) recs.push(`Most leads haven't shared a budget. Ask early ("what range are you hoping to stay in?") — it makes matching much faster.`);
  const stocked = new Set(S.vehicles.filter(v=>v.status==="available").map(v=>(v.body_type||"").toLowerCase()));
  typeRows.filter(([k])=>BODY[k] && !stocked.has(k)).slice(0,2).forEach(([k,n])=>recs.push(`${n} open lead${n>1?"s want":" wants"} ${k==="suv"?"an SUV":"a "+k} and you have none available — consider sourcing one.`));
  if (typeRows[0]) recs.push(`Instagram idea: a short walkaround or "what $X gets you" video aimed at people looking for ${typeRows[0][0]==="first car"?"a first car":typeRows[0][0]==="AWD/4WD"?"AWD for winter":(typeRows[0][0]==="suv"?"an SUV":"a "+typeRows[0][0])} — the most requested this period.`);
  if (!cur.length) recs.push(`No new leads this period. Link cargo-dealership.com/#enquire in your Instagram bio and every post, and spend 10 minutes a day pasting local "looking for a car" posts into Research a Lead.`);
  if (!runs.length) recs.push(`No research was run this period. Use Research a Lead on Facebook-group posts, or ask Claude in chat to search for local buyers.`);

  const tbl = (head, rows) => rows.length ? `<div class="tablewrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr style="cursor:default">${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : `<div class="muted small">No data yet.</div>`;
  const bars = (rows, total) => rows.length ? rows.map(([k,n])=>`<div style="display:grid;grid-template-columns:120px 1fr 32px;gap:10px;align-items:center;margin-bottom:6px"><span class="small">${esc(k)}</span><div class="bar"><i style="width:${n/Math.max(1,total)*100}%"></i></div><b class="small">${n}</b></div>`).join("") : `<div class="muted small">No data yet.</div>`;
  const maxT = Math.max(1,...typeRows.map(r=>r[1]));
  const kpi = [["New leads",cur.length,delta(cur.length,prev.length)],["Website enquiries",enq,""],["Messages sent",sentN,""],["Appointments (next 7 days)",apptNow,""],["Sales",soldNow,""],["Research runs",runs.length,`${runs.reduce((a,r)=>a+(r.results_count||0),0)} leads saved`]];

  V.innerHTML = `
  <div class="top"><h2>Sales report</h2><div style="display:flex;gap:8px;align-items:center"><select id="rpDays" style="width:auto">${opts([["7","Last 7 days"],["14","Last 14 days"],["30","Last 30 days"]],String(REPORT_DAYS))}</select><button class="btn ghost" id="rpPrint">🖨 Print / save PDF</button></div></div>
  <p class="muted small" style="margin-top:-8px">${fmtDate(start)} – ${fmtDate(now)} · Car-Go Dealership Inc. · generated ${fmtDT(now)}</p>
  <div class="sec">Verified numbers — counted from your CRM</div>
  <div class="grid kpis">${kpi.map(([k,v,dl])=>`<div class="kpi"><small>${k}</small><b>${v}</b>${dl?`<div class="muted small">${dl}${k==="New leads"?" vs previous period":""}</div>`:""}</div>`).join("")}</div>
  <div class="grid two" style="margin-top:14px">
    <div class="panel"><h3>Best-performing sources (all time)</h3>${tbl(["Source","This period","Total","Qualified+","Sold","Avg score"], srcRows.map(r=>[esc(r.lab),r.c,r.all,r.ql,r.sold,r.avg??"–"]))}</div>
    <div class="panel"><h3>Most requested vehicle types (open leads)</h3>${bars(typeRows.map(([k,n])=>[k==="suv"?"SUV":k[0].toUpperCase()+k.slice(1),n]),maxT)}</div>
  </div>
  <div class="grid two" style="margin-top:14px">
    <div class="panel"><h3>Customer budgets</h3>${bars(buckets.map(b=>[b[0],bud[b[0]]||0]).filter(r=>r[1]).concat(unknownBud?[["Not stated",unknownBud]]:[]), Math.max(1,pool.length))}</div>
    <div class="panel"><h3>Where leads are</h3>${bars(Object.entries(locs).sort((a,b)=>b[1]-a[1]).slice(0,8), Math.max(1,...Object.values(locs)))}</div>
  </div>
  <div class="panel" style="margin-top:14px"><h3>Inventory vs. demand</h3>
    ${tbl(["Vehicle","Price","Open leads matched"], vehDemand.map(x=>[esc(vehTitle(x.v)), x.v.price!=null?money(x.v.price):'<span class="muted">not set</span>', x.n]))}
    <p class="muted small" style="margin:10px 0 0">${unmatched} scored open lead${unmatched===1?"":"s"} with no matching car in stock.</p></div>
  <div class="sec">Recommendations — generated by rules from the numbers above (suggestions, not facts)</div>
  <div class="panel"><ol style="margin:0;padding-left:20px;display:grid;gap:8px">${recs.map(r=>`<li>${esc(r)}</li>`).join("")}</ol></div>`;
  $("#rpDays").onchange = e => { REPORT_DAYS=Number(e.target.value); renderReports(); };
  $("#rpPrint").onclick = () => window.print();
}

    <p class="muted small" style="margin-top:-6px">Anyone here can't be approved for outreach. People are added automatically when you record STOP on a lead.</p>
    <div class="form" style="margin-bottom:12px"><div><label>Type</label><select id="spType"><option value="email">Email</option><option value="phone">Phone</option><option value="handle">Social handle</option></select></div><div><label>Value</label><input id="spVal"></div><div class="full"><button class="btn ghost sm" id="spAdd">Add to list</button></div></div>
    ${supp.length?`<div class="tablewrap"><table><thead><tr><th>Type</th><th>Value</th><th>Reason</th><th>Added</th></tr></thead><tbody>${supp.map(s=>`<tr style="cursor:default"><td>${esc(s.identifier_type)}</td><td>${esc(s.identifier)}</td><td>${esc(s.reason)}</td><td>${fmtDate(s.created_at)}</td></tr>`).join("")}</tbody></table></div>`:""}
  </div>`;
  if (owner){
    $("#saveSet").onclick = async () => { const f=$("#sf"); try { await q(sb.from("settings").update({business_name:f.business_name.value.trim(),address:f.address.value.trim(),phone:nul(f.phone.value),email:nul(f.email.value),website:nul(f.website.value),unsubscribe_text:f.unsubscribe_text.value.trim(),updated_at:new Date().toISOString()}).eq("id",1)); toast("Saved."); await loadAll(); } catch(e){ toast(friendlyErr(e),true); } };
    $("#invAdd").onclick = async () => { const email=$("#invEmail").value.trim().toLowerCase(); if(!/^\S+@\S+\.\S+$/.test(email)) return toast("Enter a valid email.",true);
      try { await q(sb.from("staff_invites").upsert({email, full_name:nul($("#invName").value), role:$("#invRole").value})); await log("staff_invited","staff",null,{email}); toast("Invited."); renderSettings(); } catch(e){ toast(friendlyErr(e),true); } };
    $$("[data-toggle]").forEach(b=>b.onclick=async()=>{ const s=S.staff.find(x=>x.id===b.dataset.toggle); try{ await q(sb.from("staff").update({active:!s.active}).eq("id",s.id)); s.active=!s.active; renderSettings(); }catch(e){ toast(friendlyErr(e),true);} });
  }
  $("#spAdd").onclick = async () => { const t=$("#spType").value; let v=$("#spVal").value.trim(); if(!v) return; v = t==="phone" ? v.replace(/\D/g,"") : v.toLowerCase();
    try { await q(sb.from("suppression_list").insert({identifier:v, identifier_type:t, reason:"Added manually"})); toast("Added."); renderSettings(); } catch(e){ toast(/duplicate|unique/.test(e.message)?"Already on the list.":friendlyErr(e),true); } };
}

boot().catch(e => { document.body.insertAdjacentHTML("afterbegin", `<div class="toast err">Couldn't start: ${esc(e.message)}</div>`); });
</script>
</body>
</html>
